<script>
  // Before anything paints: the theme the customer chose (or the phone's), whether this
  // is a reload (the logo then shows only briefly), and the scroll offset an installed
  // app would otherwise restore.
  (function () {
    var d = document.documentElement, pref = "system", warm = false;
    try { pref = localStorage.getItem("lamiz.v1.theme") || "system"; } catch (e) {}
    try { warm = sessionStorage.getItem("lamiz.v1.booted") === "1"; } catch (e) {}
    var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    d.setAttribute("data-theme", pref);
    d.setAttribute("data-mode", dark ? "dark" : "light");
    var m = document.getElementById("theme-color");
    if (m) m.setAttribute("content", dark ? "#0C0C0D" : "#F6F4F1");
    d.className += " booting" + (warm ? " boot-warm" : "");
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    // if the app never arrives, do not keep the page behind the opening screen
    setTimeout(function () {
      var b = document.getElementById("boot");
      if (b) { b.parentNode.removeChild(b); d.classList.remove("booting"); }
    }, 9000);
  })();
</script>

<!-- The top chrome: their L and wordmark, the page title once its large title has
     scrolled under, and the check-in chip. No bar behind it — a scroll-edge blur. -->
<header id="bar" class="bar">
  <div class="bar-l">
    <button class="glassbtn" id="bar-back" type="button" aria-label="Back" hidden></button>
    <a class="bar-home" href="#/" aria-label="Lamiz Coffee, home">
      <span class="bar-mark" id="bar-mark"></span>
      <span class="bar-word" id="bar-word"></span>
    </a>
  </div>
  <span class="bar-title" id="bar-title" aria-hidden="true"></span>
  <div class="bar-r">
    <button class="glassbtn chip-ci" id="ci-chip" type="button" data-in="0" data-live="0" aria-label="Check in">
      <span class="ci-dot"></span><span id="ci-chip-label">Check in</span>
    </button>
  </div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<!-- The bag, floating over the tab bar whenever there is something in it. -->
<a id="acc" class="acc" href="#/bag" hidden aria-label="View your bag">
  <span class="acc-n" id="acc-n">0</span>
  <span class="acc-t"><b id="acc-sum"></b><span id="acc-beans"></span></span>
  <span class="acc-go">View bag<span id="acc-chev"></span></span>
</a>

<!-- Five tabs on glass, and the bag beside them. The lens behind the active tab can
     be picked up and dragged. -->
<div class="dockbar" id="dockbar">
  <nav id="tabs" class="tabs" aria-label="Primary">
    <span class="tabs-lens" id="tabs-lens" aria-hidden="true"></span>
    <div class="tabs-row" id="tabs-row">
      <a class="tab" data-tab="home" href="#/" draggable="false"><span class="tab-ico"></span><span class="tab-l">Home</span></a>
      <a class="tab" data-tab="menu" href="#/menu" draggable="false"><span class="tab-ico"></span><span class="tab-l">Menu</span></a>
      <a class="tab" data-tab="checkin" href="#/checkin" draggable="false"><span class="tab-ico"></span><span class="tab-l">Check in</span></a>
      <a class="tab" data-tab="branches" href="#/branches" draggable="false"><span class="tab-ico"></span><span class="tab-l">Branches</span></a>
      <a class="tab" data-tab="profile" href="#/profile" draggable="false"><span class="tab-ico"></span><span class="tab-l">Profile</span></a>
    </div>
  </nav>
  <a class="bagbtn" id="bagbtn" href="#/bag" aria-label="Bag, empty" draggable="false">
    <span id="bag-ico"></span>
    <span class="bag-badge" id="bag-badge" aria-hidden="true">0</span>
  </a>
</div>

<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite" aria-atomic="true"></div>
